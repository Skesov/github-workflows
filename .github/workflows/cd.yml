name: Reusable CD

on:
  workflow_call:
    inputs:
      components:
        description: |
          YAML list of components. Each entry:
            name:          logical name (matrix key, dorny filter id, must be unique)
            stack:         python | node | go
            paths:         [glob, ...] for dorny/paths-filter
            package-path:  release-please key (must match release-please-config.json)
            setup:         per-stack setup (python-version | node-version | go-version,
                           package-manager [node], working-directory [any], install-command [node])
            lint:          lint config (paths [python|go], commands [node], args/version [go])
            test:          test config (paths [python|go], commands [node], args, env,
                           e2e-command [node], playwright [node], playwright-report-path [node])
            image:         { name, context, dockerfile, build-args, cache-scope, platforms }
            deploy:        { manifest-path, tag-paths }
          See README for a full example.
        type: string
        required: true
      target-branch:
        description: "Branch release-please tracks"
        type: string
        default: "master"
      release-config-file:
        description: "Path to release-please-config.json (empty = repo default)"
        type: string
        default: ""
      release-manifest-file:
        description: "Path to .release-please-manifest.json (empty = repo default)"
        type: string
        default: ""
      homelab-repo:
        description: "GitOps repo to update"
        type: string
        default: "Skesov/homelab"
      environment:
        description: "GitHub Environment for deploy job"
        type: string
        default: "production"
      default-platforms:
        description: "Default Docker platforms when component doesn't specify"
        type: string
        default: "linux/arm64"
    secrets:
      registry-token:
        description: "Token for container registry auth"
        required: true
      gitops-token:
        description: "GitHub PAT with write access to homelab repo"
        required: true
    outputs:
      releases_created:
        description: "true if any release was created"
        value: ${{ jobs.release.outputs.releases_created }}
      released_packages:
        description: "JSON array of released packages"
        value: ${{ jobs.release.outputs.released_packages }}

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  # Detect which components changed and build per-stack lint/test matrices.
  # dorny/paths-filter compares against the previous commit on push.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python_lint_count: ${{ steps.matrices.outputs.python_lint_count }}
      python_lint_matrix: ${{ steps.matrices.outputs.python_lint_matrix }}
      python_test_count: ${{ steps.matrices.outputs.python_test_count }}
      python_test_matrix: ${{ steps.matrices.outputs.python_test_matrix }}
      node_lint_count: ${{ steps.matrices.outputs.node_lint_count }}
      node_lint_matrix: ${{ steps.matrices.outputs.node_lint_matrix }}
      node_test_count: ${{ steps.matrices.outputs.node_test_count }}
      node_test_matrix: ${{ steps.matrices.outputs.node_test_matrix }}
      go_lint_count: ${{ steps.matrices.outputs.go_lint_count }}
      go_lint_matrix: ${{ steps.matrices.outputs.go_lint_matrix }}
      go_test_count: ${{ steps.matrices.outputs.go_test_count }}
      go_test_matrix: ${{ steps.matrices.outputs.go_test_matrix }}
    steps:
      - uses: actions/checkout@v7

      - name: Build dorny/paths-filter config from components
        id: filter_cfg
        env:
          COMPONENTS: ${{ inputs.components }}
        run: |
          set -euo pipefail
          # Convert components YAML to dorny map: name -> paths[].
          # Transform runs in jq: mikefarah yq (the runner's yq) has no
          # `add` function — that expression is jq syntax and fails its
          # lexer. JSON is valid YAML, so dorny accepts the jq output.
          filters=$(yq -o=json . <<<"$COMPONENTS" \
            | jq -c '[.[] | {(.name): .paths}] | add // {}')
          {
            echo "filters<<DORNY_EOF"
            echo "$filters"
            echo "DORNY_EOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: ${{ steps.filter_cfg.outputs.filters }}

      - name: Build per-stack lint/test matrices
        id: matrices
        env:
          COMPONENTS: ${{ inputs.components }}
          CHANGED: ${{ steps.filter.outputs.changes }}
          MATRIX_JQ: |
            def changed_only(s):
              [.[] | select(.stack == s and (.name | IN($changed[])))];
            {
              python_lint: (changed_only("python") | map({
                name,
                python_version: (.setup["python-version"] // "3.12"),
                ruff_paths: (.lint.paths // ".")
              })),
              python_test: (changed_only("python") | map({
                name,
                python_version: (.setup["python-version"] // "3.12"),
                pytest_paths: (.test.paths // "."),
                pytest_args: (.test.args // ""),
                pytest_env: ((.test.env // {}) | tostring)
              })),
              node_lint: (changed_only("node") | map({
                name,
                node_version: (.setup["node-version"] // "22"),
                package_manager: (.setup["package-manager"] // "pnpm"),
                working_directory: (.setup["working-directory"] // "."),
                install_command: (.setup["install-command"] // ""),
                lint_commands: (.lint.commands // "")
              })),
              node_test: (changed_only("node") | map({
                name,
                node_version: (.setup["node-version"] // "22"),
                package_manager: (.setup["package-manager"] // "pnpm"),
                working_directory: (.setup["working-directory"] // "."),
                install_command: (.setup["install-command"] // ""),
                test_commands: (.test.commands // ""),
                test_env: ((.test.env // {}) | tostring),
                e2e_command: (.test["e2e-command"] // ""),
                playwright: (.test.playwright // false),
                playwright_report_path: (.test["playwright-report-path"] // "playwright-report/")
              })),
              go_lint: (changed_only("go") | map({
                name,
                go_version: (.setup["go-version"] // "stable"),
                working_directory: (.setup["working-directory"] // "."),
                golangci_version: (.lint.version // "latest"),
                lint_args: (.lint.args // "")
              })),
              go_test: (changed_only("go") | map({
                name,
                go_version: (.setup["go-version"] // "stable"),
                working_directory: (.setup["working-directory"] // "."),
                test_paths: (.test.paths // "./..."),
                test_args: (.test.args // "-race -cover"),
                test_env: ((.test.env // {}) | tostring)
              }))
            }
          VALIDATE_JQ: |
            [.[] | select(.stack != "python" and .stack != "node" and .stack != "go") | .name]
            | join(",")
        run: |
          set -euo pipefail
          components_json=$(yq -o=json . <<<"$COMPONENTS")
          unknown=$(jq -r "$VALIDATE_JQ" <<<"$components_json")
          if [ -n "$unknown" ]; then
            echo "::error::Unknown stack for components: $unknown (expected python|node|go)"
            exit 1
          fi
          all=$(jq -c --argjson changed "$CHANGED" "$MATRIX_JQ" <<<"$components_json")
          for key in python_lint python_test node_lint node_test go_lint go_test; do
            items=$(jq -c ".${key}" <<<"$all")
            count=$(jq 'length' <<<"$items")
            echo "${key}_count=${count}" >> "$GITHUB_OUTPUT"
            if [ "$count" -gt 0 ]; then
              matrix=$(jq -c --argjson items "$items" -n '{include: $items}')
            else
              matrix='{"include":[]}'
            fi
            {
              echo "${key}_matrix<<MATRIX_EOF"
              echo "$matrix"
              echo "MATRIX_EOF"
            } >> "$GITHUB_OUTPUT"
          done
        shell: bash

  lint-python:
    needs: changes
    if: needs.changes.outputs.python_lint_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.python_lint_matrix) }}
    uses: ./.github/workflows/_lint-python.yml
    with:
      python-version: ${{ matrix.python_version }}
      ruff-paths: ${{ matrix.ruff_paths }}

  test-python:
    needs: changes
    if: needs.changes.outputs.python_test_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.python_test_matrix) }}
    uses: ./.github/workflows/_test-python.yml
    with:
      python-version: ${{ matrix.python_version }}
      pytest-paths: ${{ matrix.pytest_paths }}
      pytest-args: ${{ matrix.pytest_args }}
      pytest-env: ${{ matrix.pytest_env }}
    secrets: inherit

  lint-node:
    needs: changes
    if: needs.changes.outputs.node_lint_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.node_lint_matrix) }}
    uses: ./.github/workflows/_lint-node.yml
    with:
      node-version: ${{ matrix.node_version }}
      package-manager: ${{ matrix.package_manager }}
      working-directory: ${{ matrix.working_directory }}
      install-command: ${{ matrix.install_command }}
      lint-commands: ${{ matrix.lint_commands }}

  test-node:
    needs: changes
    if: needs.changes.outputs.node_test_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.node_test_matrix) }}
    uses: ./.github/workflows/_test-node.yml
    with:
      node-version: ${{ matrix.node_version }}
      package-manager: ${{ matrix.package_manager }}
      working-directory: ${{ matrix.working_directory }}
      install-command: ${{ matrix.install_command }}
      test-commands: ${{ matrix.test_commands }}
      test-env: ${{ matrix.test_env }}
      e2e-command: ${{ matrix.e2e_command }}
      playwright: ${{ matrix.playwright }}
      playwright-report-path: ${{ matrix.playwright_report_path }}
    secrets: inherit

  lint-go:
    needs: changes
    if: needs.changes.outputs.go_lint_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.go_lint_matrix) }}
    uses: ./.github/workflows/_lint-go.yml
    with:
      go-version: ${{ matrix.go_version }}
      working-directory: ${{ matrix.working_directory }}
      golangci-lint-version: ${{ matrix.golangci_version }}
      args: ${{ matrix.lint_args }}

  test-go:
    needs: changes
    if: needs.changes.outputs.go_test_count != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.go_test_matrix) }}
    uses: ./.github/workflows/_test-go.yml
    with:
      go-version: ${{ matrix.go_version }}
      working-directory: ${{ matrix.working_directory }}
      test-paths: ${{ matrix.test_paths }}
      test-args: ${{ matrix.test_args }}
      test-env: ${{ matrix.test_env }}
    secrets: inherit

  # Release gate: run only when none of the lint/test jobs failed.
  # Skipped jobs (empty matrices) count as passing.
  release:
    needs: [lint-python, test-python, lint-node, test-node, lint-go, test-go]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/_release.yml
    with:
      target-branch: ${{ inputs.target-branch }}
      config-file: ${{ inputs.release-config-file }}
      manifest-file: ${{ inputs.release-manifest-file }}

  # Build the docker matrix from components, keeping only released ones.
  transform:
    needs: release
    if: needs.release.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.t.outputs.build_matrix }}
    steps:
      - name: Build docker matrix from components + released packages
        id: t
        env:
          COMPONENTS: ${{ inputs.components }}
          RELEASED: ${{ needs.release.outputs.released_packages }}
          DEFAULT_PLATFORMS: ${{ inputs.default-platforms }}
          BUILD_MATRIX_JQ: |
            {
              include: [
                $components[] as $c
                | ($released[] | select(.path == $c["package-path"])) as $r
                | {
                    name:            $c.image.name,
                    context:         ($c.image.context // "."),
                    dockerfile:      ($c.image.dockerfile // ""),
                    "build-args":    ($c.image["build-args"] // ""),
                    "cache-scope":   ($c.image["cache-scope"] // ""),
                    "manifest-path": $c.deploy["manifest-path"],
                    "tag-paths":     ($c.deploy["tag-paths"] // ".spec.values.image.tag"),
                    platforms:       ($c.image.platforms // $default_platforms),
                    version:         $r.version,
                    tag:             $r.tag
                  }
              ]
            }
        run: |
          set -euo pipefail
          components_json=$(yq -o=json . <<<"$COMPONENTS")
          matrix=$(jq -nc \
            --argjson components "$components_json" \
            --argjson released "$RELEASED" \
            --arg default_platforms "$DEFAULT_PLATFORMS" \
            "$BUILD_MATRIX_JQ")
          count=$(jq '.include | length' <<<"$matrix")
          echo "Matrix entries: $count"
          jq . <<<"$matrix"
          if [ "$count" = "0" ]; then
            echo "::error::Release created but no component matched a released package-path."
            echo "::error::Check components[*].package-path against release-please-config.json."
            exit 1
          fi
          {
            echo "build_matrix<<EOF"
            echo "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        shell: bash

  build:
    needs: [release, transform]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.transform.outputs.build_matrix) }}
    uses: ./.github/workflows/_docker.yml
    with:
      image-name: ${{ matrix.name }}
      version: ${{ matrix.version }}
      context: ${{ matrix.context }}
      dockerfile: ${{ matrix.dockerfile }}
      build-args: ${{ matrix.build-args }}
      cache-scope: ${{ matrix.cache-scope }}
      platforms: ${{ matrix.platforms }}
      push-latest: true
    secrets:
      registry-token: ${{ secrets.registry-token }}

  deploy:
    needs: [release, transform, build]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.transform.outputs.build_matrix) }}
    uses: ./.github/workflows/_deploy.yml
    with:
      version: ${{ matrix.version }}
      homelab-repo: ${{ inputs.homelab-repo }}
      manifest-path: ${{ matrix.manifest-path }}
      tag-paths: ${{ matrix.tag-paths }}
      environment: ${{ inputs.environment }}
    secrets:
      gitops-token: ${{ secrets.gitops-token }}
