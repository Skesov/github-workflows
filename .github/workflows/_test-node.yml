name: Reusable Test (Node)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      package-manager:
        description: "Package manager: pnpm | npm | yarn"
        type: string
        default: "pnpm"
      working-directory:
        description: "Working directory (where package.json lives)"
        type: string
        default: "."
      install-command:
        description: "Override install command. Empty derives from package-manager."
        type: string
        default: ""
      test-commands:
        description: |
          Newline-separated test commands. Empty defaults to `<pm> test`.
        type: string
        default: ""
      test-env:
        description: 'Env vars as JSON, e.g. {"KEY": "value"}'
        type: string
        default: "{}"
      e2e-command:
        description: |
          Optional end-to-end command. Empty skips the e2e step.
          Runs after `test-commands` so e2e gets a freshly-installed env.
        type: string
        default: ""
      playwright:
        description: "Cache and install Playwright Chromium before e2e."
        type: boolean
        default: false
      playwright-report-path:
        description: "Path to upload as artifact on e2e failure (relative to working-directory)."
        type: string
        default: "playwright-report/"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve lockfile path
        id: lock
        env:
          PM: ${{ inputs.package-manager }}
          WD: ${{ inputs.working-directory }}
        run: |
          case "$PM" in
            pnpm) name="pnpm-lock.yaml" ;;
            yarn) name="yarn.lock" ;;
            npm)  name="package-lock.json" ;;
            *) echo "::error::Unknown package-manager: $PM (expected pnpm|npm|yarn)"; exit 1 ;;
          esac
          echo "path=${WD%/}/$name" >> "$GITHUB_OUTPUT"
        shell: bash
        working-directory: .

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6.0.8
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ steps.lock.outputs.path }}

      - name: Install dependencies
        env:
          INSTALL_CMD: ${{ inputs.install-command }}
          PM: ${{ inputs.package-manager }}
        run: |
          if [ -n "$INSTALL_CMD" ]; then
            eval "$INSTALL_CMD"
          else
            case "$PM" in
              pnpm) pnpm install --frozen-lockfile ;;
              yarn) yarn install --immutable ;;
              npm)  npm ci ;;
            esac
          fi
        shell: bash

      - name: Export secrets to env
        env:
          _SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo "$_SECRETS" \
            | jq -r 'to_entries[]
                | select(.key != "github_token")
                | "\(.key)=\(.value)"' \
            >> "$GITHUB_ENV"
        shell: bash
        working-directory: .

      - name: Export test-env to env
        if: inputs.test-env != '{}'
        env:
          TEST_ENV: ${{ inputs.test-env }}
        run: echo "$TEST_ENV" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
        shell: bash
        working-directory: .

      - name: Run test commands
        env:
          PM: ${{ inputs.package-manager }}
          TEST_CMDS: ${{ inputs.test-commands }}
        run: |
          if [ -z "$TEST_CMDS" ]; then
            TEST_CMDS="$PM test"
          fi
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            eval "$cmd"
            echo "::endgroup::"
          done <<< "$TEST_CMDS"
        shell: bash

      - name: Cache Playwright browsers
        if: inputs.playwright && inputs.e2e-command != ''
        uses: actions/cache@v5.0.5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles(steps.lock.outputs.path) }}

      - name: Install Playwright Chromium
        if: inputs.playwright && inputs.e2e-command != ''
        run: npx playwright install --with-deps chromium
        shell: bash

      - name: Run e2e
        if: inputs.e2e-command != ''
        env:
          E2E_CMD: ${{ inputs.e2e-command }}
        run: eval "$E2E_CMD"
        shell: bash

      - name: Upload Playwright report
        if: failure() && inputs.playwright && inputs.e2e-command != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ inputs.working-directory }}/${{ inputs.playwright-report-path }}
          retention-days: 7
