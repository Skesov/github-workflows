name: Probe Mid

on:
  workflow_call:

jobs:
  skipped_dep:
    if: false
    runs-on: ubuntu-latest
    steps:
      - run: echo never

  rel_plain:
    uses: ./.github/workflows/_probe-inner.yml

  rel_cond:
    needs: [skipped_dep]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/_probe-inner.yml

  rel_cond_nodep:
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/_probe-inner.yml

  # Baseline: plain ancestor, plain gate.
  gate_plain:
    needs: rel_plain
    if: needs.rel_plain.outputs.flag == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "gate_plain ran"

  # Ancestor has a skipped dependency; gate has no status function.
  gate_cond:
    needs: rel_cond
    if: needs.rel_cond.outputs.flag == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "gate_cond ran"

  # Same ancestor, but the gate carries a status function.
  gate_cond_status:
    needs: rel_cond
    if: ${{ !cancelled() && needs.rel_cond.outputs.flag == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "gate_cond_status ran"

  # Conditional ancestor without any skipped dependency.
  gate_nodep:
    needs: rel_cond_nodep
    if: needs.rel_cond_nodep.outputs.flag == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "gate_nodep ran"
