name: Reusable Lint (Node)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        type: string
        default: "22"
      package-manager:
        description: "Package manager: pnpm | npm | yarn. Drives caching and default install command."
        type: string
        default: "pnpm"
      working-directory:
        description: "Working directory (where package.json lives)"
        type: string
        default: "."
      install-command:
        description: "Override install command. Empty derives from package-manager."
        type: string
        default: ""
      lint-commands:
        description: |
          Newline-separated commands to run. Empty defaults to:
          `<pm> typecheck` then `<pm> lint`.
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve lockfile path
        id: lock
        env:
          PM: ${{ inputs.package-manager }}
          WD: ${{ inputs.working-directory }}
        run: |
          case "$PM" in
            pnpm) name="pnpm-lock.yaml" ;;
            yarn) name="yarn.lock" ;;
            npm)  name="package-lock.json" ;;
            *) echo "::error::Unknown package-manager: $PM (expected pnpm|npm|yarn)"; exit 1 ;;
          esac
          echo "path=${WD%/}/$name" >> "$GITHUB_OUTPUT"
        shell: bash
        working-directory: .

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v6.0.9
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ steps.lock.outputs.path }}

      - name: Install dependencies
        env:
          INSTALL_CMD: ${{ inputs.install-command }}
          PM: ${{ inputs.package-manager }}
        run: |
          if [ -n "$INSTALL_CMD" ]; then
            eval "$INSTALL_CMD"
          else
            case "$PM" in
              pnpm) pnpm install --frozen-lockfile ;;
              yarn) yarn install --immutable ;;
              npm)  npm ci ;;
            esac
          fi
        shell: bash

      - name: Run lint commands
        env:
          PM: ${{ inputs.package-manager }}
          LINT_CMDS: ${{ inputs.lint-commands }}
        run: |
          if [ -z "$LINT_CMDS" ]; then
            LINT_CMDS=$(printf '%s typecheck\n%s lint' "$PM" "$PM")
          fi
          while IFS= read -r cmd; do
            [ -z "$cmd" ] && continue
            echo "::group::$cmd"
            eval "$cmd"
            echo "::endgroup::"
          done <<< "$LINT_CMDS"
        shell: bash
