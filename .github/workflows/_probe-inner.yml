name: Probe Inner

on:
  workflow_call:
    outputs:
      flag:
        description: "Mirrors the nested job output"
        value: ${{ jobs.run.outputs.flag }}
      payload:
        description: "Mirrors a conditional step output"
        value: ${{ jobs.run.outputs.payload }}

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      flag: ${{ steps.emit.outputs.flag }}
      payload: ${{ steps.conditional.outputs.payload || '[]' }}
    steps:
      - id: emit
        run: echo "flag=true" >> "$GITHUB_OUTPUT"
        shell: bash
      - id: conditional
        if: steps.emit.outputs.flag == 'true'
        run: echo 'payload=[{"path":"bot"}]' >> "$GITHUB_OUTPUT"
        shell: bash
